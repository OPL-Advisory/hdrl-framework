project_id = "grajbgnnnlhzvdxhldvy"

[api]
enabled = true
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 500

[auth]
enabled = true
site_url = "https://hdrlframework.org/self-assessment/"
additional_redirect_urls = [
  "http://127.0.0.1:8123/self-assessment/",
  "http://localhost:8123/self-assessment/"
]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
