name: Deploy MkDocs to GitHub Pages

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - main
      - codex/public-restore-sharing
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build site
        run: mkdocs build --strict

      - name: Validate machine-readable indicator catalogue
        run: python scripts/validate_indicator_catalogue.py

      - name: Validate versioned Presentation Kit
        run: python scripts/validate_presentation_kit.py

      - name: Validate public self-assessment test
        run: python scripts/validate_public_self_assessment.py

      - name: Check assessment provenance and test mode
        run: node --test tests/self-assessment-provenance.test.mjs tests/self-assessment-feedback-harness.test.mjs tests/self-assessment-portability.test.mjs tests/self-assessment-restore-storage.test.mjs tests/self-assessment-boundary.test.mjs

      - name: Check built-site coherence
        run: python scripts/check_site_coherence.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
