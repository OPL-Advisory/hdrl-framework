{% extends "base.html" %}

{% block extrahead %}
  {% set social_description = page.meta.description if page and page.meta and page.meta.description else config.site_description %}
  <meta property="og:title" content="{{ page.title }} — HDRL Framework" />
  <meta property="og:description" content="{{ social_description }}" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="{{ page.canonical_url }}" />
  <meta property="og:site_name" content="HDRL Framework" />
  <meta property="og:locale" content="en_GB" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="{{ page.title }} — HDRL Framework" />
  <meta name="twitter:description" content="{{ social_description }}" />
  <meta name="keywords" content="HDRL, health data, readiness level, maturity model, UK health data research, TRE, SDE, HDRS, data governance, Five Safes" />
{% endblock %}
