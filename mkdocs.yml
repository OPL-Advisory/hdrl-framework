site_name: HDRL Framework
site_description: A practical, evidence-led maturity framework for assessing organisational and system readiness for trusted, federated health data research.
site_url: https://hdrlframework.org/
site_author: OPL Advisory Ltd for Research Data Scotland

theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.footer
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.tooltips
    - toc.follow
  custom_dir: overrides
  logo: assets/images/logo.svg
  favicon: assets/images/favicon.svg

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - attr_list
  - md_in_html
  - def_list
  - toc:
      permalink: true

plugins:
  - search

hooks:
  - hooks/report_accessibility.py
  - hooks/framework_files.py
  - hooks/domain_evidence.py

extra:
  generator: false

extra_css:
  - assets/css/custom.css
  - assets/css/self-assessment.css

extra_javascript:
  - assets/js/table-keyboard.js
  - assets/js/self-assessment.js

copyright: 'HDRL Framework v1.0.1 · Research Data Scotland: commissioner and intellectual property rights owner · OPL Advisory Ltd: originator and developer · Framework methodology and public framework materials: <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a> · <a href="https://hdrlframework.org/about/">About &amp; reuse</a>'

