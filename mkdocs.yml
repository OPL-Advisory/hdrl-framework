site_name: HDRL Framework
site_description: A practical, evidence-led maturity framework for assessing organisational and system readiness for trusted, federated health data research.
site_url: https://hdrlframework.org/
site_author: OPL Advisory Ltd for Research Data Scotland

theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.footer
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.tooltips
    - toc.follow
  custom_dir: overrides
  logo: assets/images/logo.svg
  favicon: assets/images/favicon.svg

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - attr_list
  - md_in_html
  - def_list
  - toc:
      permalink: true

plugins:
  - search

extra:
  generator: false

extra_css:
  - assets/css/custom.css

copyright: 'HDRL Framework v1.0 · Research Data Scotland: commissioner and intellectual property rights owner · OPL Advisory Ltd: originator and developer · <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a> · <a href="https://hdrlframework.org/about/">About &amp; reuse</a>'

nav:
  - Home: index.md
  - Framework:
    - Overview: framework/overview.md
    - Using the Framework: framework/using-the-framework.md
    - Quick Reference: framework/quick-reference.md
    - Methodology: framework/methodology.md
    - Maturity Levels: framework/maturity-levels.md
    - Indicator Classification: framework/classification.md
    - Proposed Foundational Indicators: framework/foundational-requirements.md
    - Glossary: framework/glossary.md
  - Domains:
    - domains/index.md
    - "A: Data Coverage & Federation": domains/a-data-coverage.md
    - "B: Data Semantics & Quality": domains/b-data-semantics.md
    - "C: Governance & Access": domains/c-governance-access.md
    - "D: Research Integration": domains/d-research-integration.md
    - "E: Public Trust": domains/e-public-trust.md
    - "F: Sustainability": domains/f-sustainability.md
    - "G: Workforce & Culture": domains/g-workforce-culture.md
    - "H: Infrastructure & Compute": domains/h-infrastructure.md
  - 3 Nations Application: three-nations-assessment.md
  - About & Reuse: about.md
