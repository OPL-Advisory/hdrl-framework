<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627" role="img" aria-labelledby="title desc">
  <title id="title">HDRL Framework social sharing card</title>
  <desc id="desc">Make readiness for health data research visible. An open framework with eight domains, 64 indicators and five maturity levels.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.62" stop-color="#f1f5f9"/>
      <stop offset="1" stop-color="#e6fffb"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="0.58" stop-color="#0d9488"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="627" fill="url(#background)"/>
  <path d="M0 0h1200v18H0z" fill="url(#accent)"/>
  <circle cx="1115" cy="94" r="230" fill="#14b8a6" opacity="0.08"/>
  <circle cx="1035" cy="600" r="315" fill="#3b82f6" opacity="0.07"/>

  <g transform="translate(74 66)">
    <rect x="0" y="0" width="288" height="42" rx="21" fill="#ccfbf1"/>
    <circle cx="25" cy="21" r="6" fill="#0f766e"/>
    <text x="44" y="27" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" letter-spacing="1.5" fill="#0f766e">OPEN FRAMEWORK</text>

    <text x="0" y="152" font-family="Inter, Arial, sans-serif" font-size="62" font-weight="800" letter-spacing="-1.8" fill="#0f172a">
      <tspan x="0" dy="0">Make readiness for</tspan>
      <tspan x="0" dy="72">health data research</tspan>
      <tspan x="0" dy="72" fill="#0f766e">visible</tspan>
    </text>

    <text x="2" y="414" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="500" fill="#334155">
      <tspan x="2" dy="0">A practical, evidence-informed maturity framework</tspan>
      <tspan x="2" dy="36">for trusted, federated health data research.</tspan>
    </text>

    <line x1="0" y1="492" x2="610" y2="492" stroke="#cbd5e1" stroke-width="2"/>
    <text x="0" y="530" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#475569">
      Commissioned by Research Data Scotland · Developed by OPL Advisory
    </text>
  </g>

  <g transform="translate(865 118)" filter="url(#shadow)">
    <path d="M125 0 213 37 250 125 213 213 125 250 37 213 0 125 37 37Z" fill="url(#accent)"/>
    <circle cx="125" cy="125" r="94" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.16"/>
    <circle cx="125" cy="125" r="73" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.20"/>
    <circle cx="125" cy="125" r="52" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.24"/>
    <circle cx="125" cy="125" r="31" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.30"/>
    <path d="M125 15v220M15 125h220M47 47l156 156M203 47 47 203" stroke="#ffffff" stroke-width="2" opacity="0.13"/>
    <text x="125" y="137" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="48" font-weight="800" letter-spacing="4" fill="#ffffff">HDRL</text>
  </g>

  <g transform="translate(850 425)">
    <rect width="300" height="88" rx="18" fill="#ffffff" stroke="#ccfbf1" stroke-width="2"/>
    <text x="24" y="35" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800" letter-spacing="1.1" fill="#0f766e">8 DOMAINS · 64 INDICATORS</text>
    <text x="24" y="64" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#334155">5 maturity levels</text>
  </g>
</svg>
