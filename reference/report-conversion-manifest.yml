    status: pass
    evidence: >-
      Single H1 and ordered hierarchy; 12 named table regions; 42 scoped
      column headers; 98 scoped row headers; keyboard focus outline; light and
      dark report-accent contrast checks; no console errors.
  codex_keyboard_and_scroll_smoke:
    status: pass
    evidence: Table region received visible focus and scrolled horizontally to its maximum extent without page overflow.
  manual_keyboard_review: pending_human
